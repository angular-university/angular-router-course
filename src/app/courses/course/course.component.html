<ng-container>

  <div class="course">

    <h2>{{course.description}}</h2>

    @if (couponCode) {
      <h3 class="discount">
        Use {{couponCode}} for a huge discount!
      </h3>
    }

    @if (course) {
      <img class="course-thumbnail" [src]="course.iconUrl">
    }

    <router-outlet></router-outlet>

  </div>

</ng-container>
